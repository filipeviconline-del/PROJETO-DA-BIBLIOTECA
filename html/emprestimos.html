<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empréstimos | ToschiBook</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/paginas.css">
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">

        <!-- Barra lateral -->
        <aside class="sidebar">
            <div class="sidebar-brand logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <path d="M10 12h29c8 0 15 7 15 15v27H25c-8 0-15-6-15-14V12Z" fill="none" stroke="currentColor"
                            stroke-width="4" stroke-linejoin="round" />
                        <path d="M25 54V27c0-8 6-15 14-15" fill="none" stroke="currentColor" stroke-width="4"
                            stroke-linecap="round" />
                        <path d="M39 12c0 8 6 15 15 15" fill="none" stroke="currentColor" stroke-width="4"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <span>Toschi<span>Book</span></span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                    Início
                </a>
                <a href="livros.html" class="nav-item">
                    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                    Livros
                </a>
                <a href="usuarios.html" class="nav-item">
                    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    Usuários
                </a>
                <a href="emprestimos.html" class="nav-item active" aria-current="page">
                    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
                    Empréstimos
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="admin-chip">
                    <span class="admin-avatar">U</span>
                    <div class="admin-info">
                        <strong id="adminNome">Usuário</strong>
                        <small>Biblioteca</small>
                    </div>
                </div>

                <a href="index.html" class="logout-link" id="logoutLink">
                    <span class="nav-icon">⎋</span>
                    Sair
                </a>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <div class="dashboard-main">

            <header class="topbar">
                <div class="topbar-title">
                    <h1>Empréstimos</h1>
                    <p>Gerencie os empréstimos ativos da biblioteca</p>
                </div>

                <div class="topbar-actions">
                    <button class="btn btn-primary" id="btnNovoEmprestimo" type="button">
                        ＋ Novo empréstimo
                    </button>
                </div>
            </header>

            <div class="page-toolbar">
                <div class="search-box">
                    <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <input type="search" id="buscaEmprestimo" placeholder="Buscar por livro ou aluno..."
                        autocomplete="off">
                </div>

                <span class="panel-badge" id="emprestimosCount">0 registros</span>
            </div>

            <div class="panel">
                <div class="panel-body panel-body-tight">
                    <div class="empty-state" id="emprestimosEmpty" hidden>
                        <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
                        <p>Nenhum empréstimo encontrado.</p>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table" id="emprestimosTable" hidden>
                            <thead>
                                <tr>
                                    <th>Livro</th>
                                    <th>Aluno</th>
                                    <th>Turma</th>
                                    <th>Data</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="emprestimosBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Modal de novo empréstimo -->
    <div class="modal-overlay" id="modalEmprestimo" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
            <div class="modal-header">
                <h2 id="modalTitulo">Novo empréstimo</h2>
                <button class="modal-close" id="fecharModal" type="button" aria-label="Fechar">×</button>
            </div>

            <div class="modal-body">
                <form id="formEmprestimo" novalidate>
                    <div class="form-grid">
                        <div class="form-group full">
                            <label for="livroSelect">Livro</label>
                            <select id="livroSelect" required>
                                <option value="">Selecione um livro...</option>
                            </select>
                            <small class="select-hint" id="livroHint"></small>
                        </div>

                        <div class="form-group full">
                            <label for="usuarioSelect">Aluno</label>
                            <select id="usuarioSelect" required>
                                <option value="">Selecione um aluno...</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="cancelarModal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="salvarEmprestimo">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/javascript/api.js"></script>
    <script src="/javascript/auth.js"></script>
    <script src="/javascript/emprestimos.js"></script>
</body>

</html>
